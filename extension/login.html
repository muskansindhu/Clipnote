<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Clipnote</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="popup-container">
      <div class="login-container empty" style="display: none">
        <img src="clipnote-mark.svg" alt="" />
        <h2>Welcome to Clipnote</h2>
        <p>Sign in to save timestamped notes from any YouTube video.</p>
        <a id="login-link" class="btn" href="#">Sign in</a>
      </div>
    </div>
    <script src="config.js"></script>
    <script src="login.js"></script>
  </body>
</html>
