<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clipnote - Smart YouTube Note Taking</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="/static/assets/clipnote-logo-dark.svg"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link href="static/css/style.css" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>

  <body>
    <div class="navbar">
      <a href="/" class="navbar-brand">
        <img
          src="/static/assets/clipnote-logo-dark.svg"
          data-dark="/static/assets/clipnote-logo-dark.svg"
          data-light="/static/assets/clipnote-logo-light.svg"
          alt="Clipnote Logo"
          class="logo"
          id="clipnote-logo"
          data-theme-switchable="true"
        />
        <h1>Clipnote</h1>
      </a>
      <div class="navbar-actions">
        <button
          id="clipchat-nav-btn"
          class="dashboard-btn"
          style="display: none"
          title="Clipchat"
        >
          <i data-lucide="messages-square"></i>
        </button>
        <button
          id="dashboard-btn"
          class="dashboard-btn"
          style="display: none"
          title="Dashboard"
        >
          <i data-lucide="layout-grid"></i>
        </button>
        <div class="profile-wrapper">
          <div
            id="profile-icon-placeholder"
            class="profile-btn"
            style="display: none"
            title="Profile"
          >
            <i data-lucide="user" style="width: 18px; height: 18px"></i>
          </div>
          <div class="profile-dropdown" id="profile-dropdown">
            <button class="dropdown-item" id="manage-profile-btn">
              <i data-lucide="settings"></i> Manage Profile
            </button>
            <button class="dropdown-item" id="logout-trigger-btn">
              <i data-lucide="log-out"></i> Log Out
            </button>
          </div>
        </div>
        <button
          id="theme-toggle-btn"
          class="theme-toggle-btn"
          title="Toggle Theme"
        >
          <i data-lucide="sun" style="width: 20px; height: 20px"></i>
        </button>
      </div>
    </div>

    <main class="main-content dashboard-main">
      <header class="page-header">
        <div class="page-title-group">
          <span class="section-eyebrow">Workspace</span>
          <h2>Dashboard</h2>
          <p class="page-subtitle">
            Search, filter, and manage your video notes in one place.
          </p>
        </div>
      </header>

      <section class="panel">
        <div class="search-box">
          <div class="search-wrapper">
            <input type="text" id="search" placeholder="Search notes..." />
            <button id="search-btn" class="search-btn">
              <i data-lucide="search"></i>
            </button>
          </div>
          <div class="search-actions" id="search-actions"></div>
        </div>
        <div id="labels" class="labels-container"></div>
      </section>

      <section class="panel">
        <div class="cards" id="notes-container"></div>
        <div id="empty-state" class="empty-state" style="display: none">
          <div class="empty-icon">
            <i
              data-lucide="compass"
              style="width: 48px; height: 48px; opacity: 0.5"
            ></i>
          </div>
          <h3>No video notes yet?</h3>
          <p>
            Go explore
            <a href="https://www.youtube.com" target="_blank" class="yt-link"
              >YouTube</a
            >
            and start clipping!
          </p>
        </div>
        <div
          id="pagination-controls"
          class="pagination-controls"
          style="display: none"
        >
          <button id="prev-page" class="pagination-btn">Previous</button>
          <span id="page-indicator">Page 1</span>
          <button id="next-page" class="pagination-btn">Next</button>
        </div>
      </section>
    </main>

    <div id="filter-modal" class="modal-overlay">
      <div class="modal-confirm">
        <h3>Filter & Sort</h3>
        <form id="filter-form" class="filter-form">
          <div class="filter-fields">
            <div class="filter-section">
              <div class="filter-section-title">Sorting</div>
              <div class="filter-field">
                <label for="filter-sort">Sort by</label>
                <select id="filter-sort">
                  <option value="recent">Most recent</option>
                  <option value="title">Title A–Z</option>
                </select>
              </div>
            </div>
            <div class="filter-section">
              <div class="filter-section-title">Labels</div>
              <div class="filter-field">
                <label>Select labels</label>
                <div id="filter-labels" class="filter-labels"></div>
              </div>
            </div>
            <div class="filter-section">
              <div class="filter-section-title">Date Range</div>
              <div class="filter-row">
                <div class="filter-field">
                  <label for="filter-start">From</label>
                  <input type="date" id="filter-start" />
                </div>
                <div class="filter-field">
                  <label for="filter-end">To</label>
                  <input type="date" id="filter-end" />
                </div>
              </div>
            </div>
          </div>
          <div class="btn-group">
            <button type="button" class="btn btn-cancel" id="clear-filters">
              Clear
            </button>
            <button type="submit" class="btn btn-primary">Apply</button>
          </div>
        </form>
      </div>
    </div>


    <div id="logout-modal" class="modal-overlay">
      <div class="modal-confirm">
        <h3>Log Out</h3>
        <p>Are you sure you want to sign out?</p>
        <div class="btn-group">
          <button class="btn btn-cancel" id="cancel-logout">Cancel</button>
          <button class="btn btn-danger" id="confirm-logout">Log Out</button>
        </div>
      </div>
    </div>

    <footer class="footer">
      <div class="footer-content">
        <p>&copy; 2026 Clipnote. Built for better learning.</p>
      </div>
    </footer>
    <script src="static/js/dashboard.js"></script>
  </body>
</html>
