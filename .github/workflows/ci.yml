name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clipnote
          POSTGRES_PASSWORD: clipnote
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clipnote"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Integration tests create and drop their own throw-away databases here.
      CLIPNOTE_TEST_DATABASE_URL: postgresql://clipnote:clipnote@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check server

      - name: Check formatting
        run: ruff format --check server

      - name: Type check
        run: mypy server/clipnote

      - name: Test
        run: pytest -q

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The npm bundled with Node 22 crashes on this dependency graph (same fix as the Dockerfile).
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  extension:
    name: Extension
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check scripts parse
        run: |
          for file in extension/*.js; do
            node --check "$file"
          done

      - name: Check manifest
        run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json', 'utf8'))"

      - name: Check the extension points at a hosted server
        run: |
          if grep -E '^\s*BASE_URL:\s*"http://(localhost|127\.0\.0\.1)' extension/config.js; then
            echo "::error file=extension/config.js::BASE_URL points at localhost. Restore the hosted URL before merging."
            exit 1
          fi

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
